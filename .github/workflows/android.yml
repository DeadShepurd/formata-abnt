name: Gerar app Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci

      - name: Testar o formatador
        run: npm test

      - name: Copiar o app para o projeto Android
        run: npx cap sync android

      - name: Compilar o .apk
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Preparar o arquivo
        run: cp android/app/build/outputs/apk/release/app-release.apk formata-abnt.apk

      - uses: actions/upload-artifact@v4
        with:
          name: formata-abnt-apk
          path: formata-abnt.apk

      - name: Publicar na página de versões
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" formata-abnt.apk \
            --title "Formata ABNT 0.1.${{ github.run_number }}" \
            --notes "Baixe o arquivo formata-abnt.apk pelo celular Android e toque nele para instalar. Na primeira vez, o Android pede para permitir a instalação de apps desta fonte." \
            --latest
